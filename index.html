['📡',['تعريفات أساسية','Basic definitions'],['Telecommunication = اتصال عن بعد. Data = معلومات متفق على تمثيلها بين الأطراف. Data Communication = تبادل بيانات بين جهازين عن طريق وسيط نقل زي كابل.','Telecommunication = communication at a distance. Data = information in an agreed form. Data communication = exchange of data between two devices over a transmission medium such as a wire.'],['اتفاق الأطراف هو اللي بيعرّف "الداتا".','Data is defined by mutual agreement.'],['يعني "اتفقنا نمثلها إزاي".','"We agreed how to represent it."']],
['🧩',['المكونات الخمسة (Fig 1.1)','5 components (Fig 1.1)'],['<b>Message</b> الرسالة، <b>Sender</b> المرسل، <b>Receiver</b> المستقبل، <b>Medium</b> وسيط النقل (twisted-pair, coaxial, fiber, radio)، <b>Protocol</b> مجموعة قواعد؛ من غيره الجهازين متوصلين بس مش بيتفاهموا.','<b>Message</b>, <b>Sender</b>, <b>Receiver</b>, <b>Medium</b> (twisted-pair, coaxial, fiber, radio), <b>Protocol</b> – rules; without it devices are connected but not communicating.'],['الـ Protocol هو المكون الوحيد المنطقي مش مادي.','Protocol is the only non-physical component.'],['M-S-R-M-P: "مين سأل ريم عن المعاد؟ بروتوكول".','M-S-R-M-P.']],
['🔢',['تمثيل البيانات','Data representation'],['<span class=mono>ASCII 7-bit = 128 (2⁷) | Extended 8-bit = 256 | Unicode 16-bit = 65,536 | ISO 32-bit ≈ 4 billion</span>. الأرقام تتمثل باينري مباشرة، الصور بكسلات وألوان، الصوت والفيديو analog أو digital.','<span class=mono>ASCII 7-bit = 128 (2⁷) | Extended 8-bit = 256 | Unicode 16-bit = 65,536 | ISO 32-bit ≈ 4 billion</span>. Numbers are binary, images are pixels, audio/video analog or digital.'],['عدد الرموز = 2 أُس عدد البتات.','Symbols = 2^bits.'],['7-8-16-32.','7-8-16-32.']],
['↔️',['اتجاه تدفق البيانات (Fig 1.2)','Data flow (Fig 1.2)'],['<b>Simplex</b>: اتجاه واحد (keyboard, monitor). <b>Half-duplex</b>: الاتنين يبعتوا بس مش مع بعض (walkie-talkie). <b>Full-duplex</b>: الاتنين في نفس الوقت (التليفون).','<b>Simplex</b>: one direction (keyboard, monitor). <b>Half-duplex</b>: both, but not at the same time (walkie-talkie). <b>Full-duplex</b>: both simultaneously (telephone).'],['Half = بالدور.','Half = taking turns.'],['Walkie "حول".','Walkie = "over".']],
['🌐',['الشبكة وأهدافها','Networks & objectives'],['شبكة = أجهزة (nodes) متوصلة بروابط. 3 أهداف: مشاركة البيانات/الملفات، مشاركة الموارد الغالية (طابعة لـ 1000 موظف)، حماية البيانات (backup). معايير الجودة: Performance (throughput/delay)، Reliability، Security. وفي Distributed processing.','A network = nodes connected by links. 3 objectives: share data/files, share expensive resources (one printer for 1000 employees), data protection (backup). Criteria: Performance (throughput/delay), Reliability, Security. Plus distributed processing.'],['عايزين throughput أكتر و delay أقل.','More throughput, less delay.'],['']],
['🖥️',['مكونات الشبكة','Network components'],['<b>End devices</b>: PC, mobile, IP camera, IP TV, PlayStation, printer. <b>Intermediate</b>: Repeater, Hub, Bridge, Switch, Gateway, Firewall, Router, Modem, Wireless AP, NIC. <b>Media</b>: سلكي (fiber = ضوء) / لاسلكي (radio). <b>Protocols</b>: FTP رفع/تنزيل ملفات كبيرة، SMTP إرسال إيميل، POP3 استقبال/تخزين إيميل، HTTP تصفح، Telnet تحكم عن بعد.','<b>End devices</b>: PC, mobile, IP camera, IP TV, PlayStation, printer. <b>Intermediate</b>: Repeater, Hub, Bridge, Switch, Gateway, Firewall, Router, Modem, Wireless AP, NIC. <b>Media</b>: wired (fiber = light) / wireless (radio). <b>Protocols</b>: FTP big file transfer, SMTP send mail, POP3 retrieve mail, HTTP browsing, Telnet remote login.'],['SMTP يبعت، POP3 يستلم.','SMTP sends, POP3 receives.'],['']],
['🔗',['أنواع الاتصال (Fig 1.3)','Connection types (Fig 1.3)'],['<b>Point-to-Point</b>: لينك مخصص بين جهازين. <b>Multipoint</b>: أكتر من جهازين بيتشاركوا لينك واحد.','<b>Point-to-Point</b>: dedicated link between two devices. <b>Multipoint</b>: more than two devices share one link.'],['Bus = Multipoint.','Bus is multipoint.'],['']],
['🕸️',['التوبولوجي (Fig 1.4–1.9)','Topologies (Fig 1.4–1.9)'],['<b>Mesh</b>: links = n(n−1)/2، ports = n−1 (n=5 → 10 links). <b>Star</b>: n links، 1 port، hub (single point of failure). <b>Bus</b>: multipoint، backbone + drop line + tap، attenuation. <b>Ring</b>: n links، 2 ports، اتجاه واحد. <b>Hybrid</b>: star backbone + bus branches. جرّب المعمل تحت 👇','<b>Mesh</b>: links = n(n−1)/2, ports = n−1 (n=5 → 10 links). <b>Star</b>: n links, 1 port, hub (single point of failure). <b>Bus</b>: multipoint, backbone + drop line + tap, attenuation. <b>Ring</b>: n links, 2 ports, one direction. <b>Hybrid</b>: star backbone + bus branches. Try the lab below 👇'],['Mesh = n(n−1)/2 مش n(n−1) (الدوبلكس لينك واحد).','Mesh = n(n−1)/2, not n(n−1).'],['']],
['🏙️',['LAN / MAN / WAN','LAN / MAN / WAN'],['<b>LAN</b>: منطقة محدودة، 10–100 Mbps لحد 10 Gbps+، كل host له عنوان، قديمًا shared medium وحديثًا switch. <b>MAN</b>: مدينة — CATV وhead-end، WiMAX (IEEE 802.16)، DQDB (IEEE 802.6). <b>WAN</b>: بتربط أجهزة ربط (routers/switches/modems)، بتملكها شركات الاتصالات وبتأجّرها: Point-to-Point أو Switched.','<b>LAN</b>: limited area, 10–100 Mbps up to 10 Gbps+, unique host address, shared medium (old) vs switch (modern). <b>MAN</b>: a city — CATV with a head-end, WiMAX (IEEE 802.16), DQDB (IEEE 802.6). <b>WAN</b>: interconnects connecting devices (routers/switches/modems), owned by telecoms and leased: Point-to-Point or Switched.'],['LAN بتربط hosts، WAN بتربط أجهزة ربط.','LAN connects hosts; WAN connects connecting devices.'],['']],
['🔀',['Internetwork والـ Switching','Internetwork & switching'],['internet (i صغير) = شبكتين أو أكتر متوصلين. <b>Circuit-switched</b>: دايرة مخصصة (تليفون)، من غير تخزين، مش كفء لو الاستخدام جزئي. <b>Packet-switched</b>: store-and-forward، queue في الراوتر، كل packet له header (source/destination/control/sequence)، ولو packet ضاع يتطلب إعادة إرساله.','internet (lowercase i) = two or more connected networks. <b>Circuit-switched</b>: dedicated circuit (telephone), no storage, inefficient at partial load. <b>Packet-switched</b>: store-and-forward, router queue, each packet has a header (source/destination/control/sequence); lost packets are re-requested.'],['Packet switching أكفأ لكن فيه delay.','Packet switching is more efficient but adds delay.'],['']],
['⏳',['تاريخ الإنترنت','Internet history'],['<b>1967</b> ARPA تطرح ARPANET في اجتماع ACM (IMP). <b>1969</b> 4 nodes: UCLA, UCSB, SRI, Utah + بروتوكول NCP. <b>1972</b> Vint Cerf + Bob Kahn (Internetting Project). <b>1973</b> ورقة TCP (encapsulation, datagram, gateway). بعدين TCP اتقسم لـ TCP + IP = TCP/IP.','<b>1967</b> ARPA presents ARPANET at ACM (IMPs). <b>1969</b> four nodes: UCLA, UCSB, SRI, Utah + NCP. <b>1972</b> Vint Cerf + Bob Kahn (Internetting Project). <b>1973</b> TCP paper (encapsulation, datagram, gateway). TCP later split into TCP + IP = TCP/IP.'],['التقسيم: TCP يجزّأ ويكتشف الأخطاء، IP يعمل routing.','TCP segments/detects errors, IP routes.'],['']],
['🏢',['الـ ISPs (4 مستويات)','ISPs (4 levels)'],['International → National (SprintLink, PSINet, UUNet, AGIS, Internet MCI) → Regional → Local. الـ National بتتوصل ببعض عبر <b>NAPs</b> (لحد 600 Mbps) أو <b>Peering points</b> خاصة. الإنترنت مش هرمي بسيط ودايمًا بيتغير.','International → National (SprintLink, PSINet, UUNet, AGIS, Internet MCI) → Regional → Local. National ISPs connect via <b>NAPs</b> (up to 600 Mbps) or private <b>peering points</b>. Today’s Internet is not strictly hierarchical and constantly changing.'],['']],
['📜',['Protocols & Standards','Protocols & Standards'],['3 عناصر للبروتوكول: <b>Syntax</b> الشكل والترتيب، <b>Semantics</b> المعنى، <b>Timing</b> متى وبأي سرعة (مثال: إرسال 100 Mbps لمستقبل 1 Mbps = overload). <b>De facto</b> = بالاستخدام الواسع، <b>De jure</b> = باعتماد رسمي.','Protocol elements: <b>Syntax</b> structure, <b>Semantics</b> meaning, <b>Timing</b> when/how fast (100 Mbps sender vs 1 Mbps receiver = overload). <b>De facto</b> = by widespread use, <b>De jure</b> = officially approved.'],['de facto "بحكم الواقع"، de jure "بحكم القانون".','de facto = "by fact", de jure = "by law".']],
['🏛️',['منظمات المعايير','Standards bodies'],['<b>ISO</b> دولية. <b>ITU</b>: CCITT اتغير اسمه لـ ITU-T في 1 مارس 1993. <b>ANSI</b> خاصة وغير ربحية أمريكية. <b>IEEE</b>: Project 802 (802.3 Ethernet، 802.4، 802.5 Token Ring). <b>EIA</b> مصنّعي الإلكترونيات. Forums بتسرّع الاعتماد، FCC جهة تنظيمية. <b>Internet Draft</b> عمره 6 شهور وبلا صفة رسمية ← <b>RFC</b> (Request for Comments) ← Internet Standard.','<b>ISO</b> international. <b>ITU</b>: CCITT renamed ITU-T on 1 March 1993. <b>ANSI</b> private nonprofit US. <b>IEEE</b>: Project 802 (802.3 Ethernet, 802.4, 802.5 Token Ring). <b>EIA</b> electronics manufacturers. Forums speed adoption; FCC is a regulator. <b>Internet Draft</b>: 6-month life, no official status → <b>RFC</b> (Request for Comments) → Internet Standard.'],['']]];

['🛤️',['الوسائط Guided vs Unguided (Fig 2.1)','Guided vs Unguided (Fig 2.1)'],['Guided = مسار مادي: Twisted-pair, Coaxial (كهرباء)، Fiber (ضوء). Unguided = free space (لاسلكي).','Guided = physical path: twisted-pair, coaxial (electric current), fiber (light). Unguided = free space (wireless).'],['']],
['🌀',['Twisted-Pair: UTP vs STP','Twisted-Pair: UTP vs STP'],['سلكين نحاس معزولين ومجدولين: واحد إشارة والتاني ground، والمستقبل يقيس الفرق. اللف بيخلّي الضوضاء والـ crosstalk توصل للسلكين بالتساوي فتتلغي. <b>UTP</b> بلا shielding (أرخص، الأشهر). <b>STP</b> من IBM، foil أو braided mesh، أحسن حماية لكن أضخم وأغلى.','Two insulated copper conductors twisted: one signal, one ground; receiver measures the difference. Twisting equalises noise/crosstalk so it cancels. <b>UTP</b> unshielded (cheaper, common). <b>STP</b> by IBM, foil/braided mesh, better protection but bulkier and costlier.'],['STP نادر خارج IBM.','STP is rare outside IBM.']],
['📊',['فئات UTP (Table 2.1)','UTP categories (Table 2.1)'],['<div class=wrap><table class=mono><tr><th>CAT<th>Mbps<th>Use<tr><td>1<td>&lt;0.1<td>Telephone<tr><td>2<td>2<td>T-1<tr><td>3<td>10<td>LANs<tr><td>4<td>20<td>Token Ring<tr><td>5<td>100<td>24 AWG<tr><td>5E<td>125<td>less crosstalk/EMI<tr><td>6<td>200<td>matched components<tr><td>7<td>600<td>SSTP</table></div>','<div class=wrap><table class=mono><tr><th>CAT<th>Mbps<th>Use<tr><td>1<td>&lt;0.1<td>Telephone<tr><td>2<td>2<td>T-1<tr><td>3<td>10<td>LANs<tr><td>4<td>20<td>Token Ring<tr><td>5<td>100<td>24 AWG<tr><td>5E<td>125<td>less crosstalk/EMI<tr><td>6<td>200<td>matched components<tr><td>7<td>600<td>SSTP</table></div>'],['EIA صنّفتها 7 فئات.','EIA defined 7 categories.']],
['🔌',['RJ45 والأداء والتطبيقات','RJ45, performance, applications'],['RJ = Registered Jack، موصل keyed (اتجاه واحد صح). الـ attenuation بتزيد مع التردد (حادّة فوق 100 kHz) وبتتقاس dB/km. الـ gauge = سُمك السلك (18 أسمك وأحسن من 26). الاستخدام: التليفون، local loop، DSL، 10/100/1000/10G Base-T (أقصى طول 100 m).','RJ = Registered Jack, keyed connector (one correct direction). Attenuation rises with frequency (sharply above 100 kHz), measured in dB/km. Gauge = wire thickness (18 is thicker/better than 26). Uses: telephone, local loop, DSL, 10/100/1000/10G Base-T (max 100 m).'],['']],
['🔁',['Straight-through vs Crossover','Straight-through vs Crossover'],['Tx/Rx: Router/Firewall/PC → Tx=1,2 و Rx=3,6. Switch → Tx=3,6 و Rx=1,2. <b>Straight</b> (1↔1…) بين أجهزة مختلفة (PC↔Switch). <b>Crossover</b> (1↔3، 2↔6) بين أجهزة متشابهة. 10/100 Base-T بيستخدموا 2 pairs، 1000/10G Base-T بيستخدموا 4 pairs ثنائية الاتجاه ومش محتاجة crossover (Auto MDI-X). T568A: 1 W/Orange، 2 Orange، 3 W/Green، 4 Blue، 5 W/Blue، 6 Green، 7 W/Brown، 8 Brown.','Tx/Rx: Router/Firewall/PC → Tx=1,2 Rx=3,6. Switch → Tx=3,6 Rx=1,2. <b>Straight</b> (1↔1…) joins different types (PC↔Switch). <b>Crossover</b> (1↔3, 2↔6) joins like devices. 10/100 Base-T use 2 pairs; 1000/10G Base-T use 4 bidirectional pairs, no crossover needed (Auto MDI-X). T568A: 1 W/Orange, 2 Orange, 3 W/Green, 4 Blue, 5 W/Blue, 6 Green, 7 W/Brown, 8 Brown.'],['مختلف = Straight، زي بعض = Crossover.','Different = straight, same = crossover.'],['"زي بعض يتقاطعوا".','"Likes cross."']],
['📺',['Coaxial','Coaxial'],['قلب نحاس صلب ← insulation ← موصل خارجي (foil/braid، بيحمي ويكمّل الدايرة) ← insulation ← غلاف PVC. RG-59 (75Ω، Cable TV)، RG-58 (50Ω، Thin Ethernet)، RG-11 (50Ω، Thick Ethernet). موصلات BNC: BNC، BNC T، Terminator (يمنع انعكاس الإشارة). Attenuation أعلى من twisted-pair فبيحتاج repeaters أكتر. التطبيقات: تليفون (10,000 voice، 600 Mbps) واتبدّل بالفايبر، Cable TV، 10Base-2 (RG-58, 10 Mbps, 185 m)، 10Base-5 (RG-11, 10 Mbps, 500 m).','Solid copper core → insulation → outer conductor (foil/braid; shields and completes the circuit) → insulation → PVC jacket. RG-59 (75Ω, Cable TV), RG-58 (50Ω, Thin Ethernet), RG-11 (50Ω, Thick Ethernet). BNC connectors: BNC, BNC T, Terminator (prevents reflection). Higher attenuation than twisted-pair → more repeaters. Uses: telephone (10,000 voices, 600 Mbps; replaced by fiber), Cable TV, 10Base-2 (RG-58, 10 Mbps, 185 m), 10Base-5 (RG-11, 10 Mbps, 500 m).'],['10Base-2 = 185 m مش 200!','10Base-2 = 185 m, not 200!']],
['💡',['Fiber: التركيب وانعكاس الضوء','Fiber: construction & light'],['زجاج أو بلاستيك، بينقل الضوء. زاوية السقوط &lt; الحرجة ← انكسار؛ = الحرجة ← على السطح؛ &gt; الحرجة ← انعكاس كلي داخل الـ core (Fig 2.10). Core + Cladding (أقل كثافة). الطبقات: Outer Jacket (PVC/Teflon) → Kevlar → Plastic buffer → Cladding → Core.','Glass/plastic carrying light. Angle &lt; critical → refraction; = critical → along the interface; &gt; critical → total reflection inside the core (Fig 2.10). Core + less-dense cladding. Layers: Outer Jacket (PVC/Teflon) → Kevlar → Plastic buffer → Cladding → Core.'],['']],
['🌈',['أنماط الانتشار (Fig 7.12)','Propagation modes (Fig 7.12)'],['<b>Multimode step-index</b>: كثافة ثابتة وتغيّر مفاجئ ← تشويه. <b>Multimode graded-index</b>: كثافة تقل تدريجيًا ← مسارات منحنية وتشويه أقل. <b>Single-mode</b>: core صغير جدًا، مصدر مركّز (laser)، زاوية حرجة قرب 90° ← تشويه شبه صفر. الأحجام: 50/125، 62.5/125، 100/125 (multimode graded)، 7/125 (single).','<b>Multimode step-index</b>: constant density, sudden change → distortion. <b>Multimode graded-index</b>: density falls gradually → curved paths, less distortion. <b>Single-mode</b>: tiny core, focused laser, critical angle near 90° → almost no distortion. Sizes: 50/125, 62.5/125, 100/125 (multimode graded), 7/125 (single).'],['7/125 بس single-mode.','Only 7/125 is single-mode.']],
['🔧',['موصلات وأداء وتطبيقات الفايبر','Fiber connectors, performance, uses'],['SC (Subscriber Channel، push/pull، Cable TV)، ST (Straight-Tip، bayonet، أجهزة الشبكة، أكتر ثقة)، LC، FC، MTP/MPO، MT-RJ (حجم RJ45). الفايبر attenuation أقل ← حوالي 10× repeaters أقل (50 km مقابل ~5 km). تطبيقات: backbone (WDM لحد 1600 Gbps، SONET)، Cable TV hybrid، LANs (100Base-FX، 1000Base-X). <div class=wrap><table class=mono><tr><th>Std<th>Speed<th>Mode<th>Max<tr><td>1000BASE-LX<td>1G<td>MM/SM<td>550 m / 5 km<tr><td>10GBASE-SR<td>10G<td>MM<td>400 m<tr><td>10GBASE-LR<td>10G<td>SM<td>10 km<tr><td>10GBASE-ER<td>10G<td>SM<td>30 km</table></div>مميزات: bandwidth، attenuation أقل، مناعة EMI، ضد التآكل، خفيف، صعب التنصت. عيوب: تركيب وصيانة، اتجاه واحد (فايبرين)، تكلفة أعلى.','SC (Subscriber Channel, push/pull, cable TV), ST (Straight-Tip, bayonet, networking, more reliable), LC, FC, MTP/MPO, MT-RJ (RJ45-sized). Lower attenuation → about 10× fewer repeaters (50 km vs ~5 km). Uses: backbone (WDM up to 1600 Gbps, SONET), hybrid cable TV, LANs (100Base-FX, 1000Base-X). <div class=wrap><table class=mono><tr><th>Std<th>Speed<th>Mode<th>Max<tr><td>1000BASE-LX<td>1G<td>MM/SM<td>550 m / 5 km<tr><td>10GBASE-SR<td>10G<td>MM<td>400 m<tr><td>10GBASE-LR<td>10G<td>SM<td>10 km<tr><td>10GBASE-ER<td>10G<td>SM<td>30 km</table></div>Pros: bandwidth, low attenuation, EMI immunity, corrosion-resistant, light, hard to tap. Cons: install/maintenance, unidirectional (two fibers), higher cost.'],['UTP أرخص ومداه 100 m؛ الفايبر أغلى وأبعد ومعندوش EMI.','UTP: cheaper, 100 m, EMI-prone; fiber: costlier, longer, EMI-immune.']],
['📶',['Unguided: الطيف وطرق الانتشار','Unguided: spectrum & propagation'],['الطيف 3 kHz–900 THz (Fig 2.17): Radio+Microwave حتى 300 GHz، Infrared 300 GHz–400 THz، ثم الضوء. <b>Ground</b> (&lt;2 MHz، يتبع انحناء الأرض)، <b>Sky</b> (2–30 MHz، ينعكس من الـ ionosphere)، <b>Line-of-sight</b> (&gt;30 MHz، هوائيات متقابلة). <div class=wrap><table class=mono><tr><th>Band<th>Range<th>Prop<th>Use<tr><td>VLF<td>3–30 kHz<td>Ground<td>Navigation<tr><td>LF<td>30–300 kHz<td>Ground<td>Beacons<tr><td>MF<td>300 kHz–3 MHz<td>Sky<td>AM radio<tr><td>HF<td>3–30 MHz<td>Sky<td>CB, ship/aircraft<tr><td>VHF<td>30–300 MHz<td>Sky+LOS<td>VHF TV, FM<tr><td>UHF<td>300 MHz–3 GHz<td>LOS<td>UHF TV, cellular, paging, satellite<tr><td>SHF<td>3–30 GHz<td>LOS<td>Satellite<tr><td>EHF<td>30–300 GHz<td>LOS<td>Radar, satellite</table></div>','Spectrum 3 kHz–900 THz (Fig 2.17): radio+microwave up to 300 GHz, infrared 300 GHz–400 THz, then light. <b>Ground</b> (&lt;2 MHz, follows Earth’s curve), <b>Sky</b> (2–30 MHz, ionosphere reflection), <b>Line-of-sight</b> (&gt;30 MHz, aligned antennas). <div class=wrap><table class=mono><tr><th>Band<th>Range<th>Prop<th>Use<tr><td>VLF<td>3–30 kHz<td>Ground<td>Navigation<tr><td>LF<td>30–300 kHz<td>Ground<td>Beacons<tr><td>MF<td>300 kHz–3 MHz<td>Sky<td>AM radio<tr><td>HF<td>3–30 MHz<td>Sky<td>CB, ship/aircraft<tr><td>VHF<td>30–300 MHz<td>Sky+LOS<td>VHF TV, FM<tr><td>UHF<td>300 MHz–3 GHz<td>LOS<td>UHF TV, cellular, paging, satellite<tr><td>SHF<td>3–30 GHz<td>LOS<td>Satellite<tr><td>EHF<td>30–300 GHz<td>LOS<td>Radar, satellite</table></div>'],['']],
['📻',['Radio / Microwave / Infrared','Radio / Microwave / Infrared'],['<b>Radio</b> 3 kHz–1 GHz: omnidirectional، مسافات طويلة، بتخترق الحيطان، data rate قليل، منظّمة حكوميًا، multicast (AM/FM/TV/paging). <b>Microwave</b> 1–300 GHz: unidirectional، line-of-sight، data rate عالي (~299 GHz)، مبتخترقش الحيطان، هوائيات parabolic dish وhorn، unicast (cellular/satellite/wireless LAN). <b>Infrared</b> 300 GHz–400 THz (1 mm–770 nm): مدى قصير، مبيخترقش الحيطان، IrDA (75 kbps/8 m ثم 4 Mbps)، يحتاج line-of-sight.','<b>Radio</b> 3 kHz–1 GHz: omnidirectional, long range, penetrates walls, low data rate, regulated, multicast (AM/FM/TV/paging). <b>Microwave</b> 1–300 GHz: unidirectional, line-of-sight, high data rate (~299 GHz), no wall penetration, parabolic dish & horn antennas, unicast (cellular/satellite/wireless LAN). <b>Infrared</b> 300 GHz–400 THz (1 mm–770 nm): short range, no wall penetration, IrDA (75 kbps/8 m → 4 Mbps), needs line-of-sight.'],['Radio = multicast، Microwave = unicast.','Radio = multicast, microwave = unicast.']]];
